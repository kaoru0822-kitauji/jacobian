schema_version = "1"

[dataset]
id = "jacobian/agent-workflow-v1"
version = "1.0.0"
title = "Jacobian agent workflow observations"
purpose = "Fixed Jacobian-enabled mathematical workflows for Oracle validation and agent observation."
claim_class = "workflow-observation"
answer_visibility = "hidden-at-runtime"
default_execution_profile = "oracle-and-observation"
keywords = ["mathematics", "jacobian", "agent-workflow"]
authors = [{ name = "Jacobian contributors", email = "maintainers@jacobian.invalid" }]

[[tasks]]
id = "jacobian/agent-workflow-v1-finite-partition"
path = "tasks/mathematical-sciences/number-theory/finite-partition"
maximum_assurance = "VERIFIED"
required_provider = "core"

