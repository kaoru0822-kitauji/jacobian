<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">Jacobian mathematical verification motif</title>
  <desc id="desc">Three distinct inputs flow through a polynomial map to one output, beside the exact equations determinant J sub F equals minus two and F of p one equals F of p two equals F of p three.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="30" x2="1360" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#10162A"/>
    </linearGradient>
    <linearGradient id="equationPanel" x1="550" y1="94" x2="1250" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13284A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#121D37" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="flow" x1="168" y1="108" x2="526" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EE3FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7DD3FC" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8FB5D9" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1440" height="480" rx="28" fill="url(#background)"/>
  <rect width="1440" height="480" rx="28" fill="url(#grid)"/>
  <path d="M72 53H1368" stroke="#8FB5D9" stroke-opacity="0.13"/>
  <path d="M72 427H1368" stroke="#8FB5D9" stroke-opacity="0.13"/>

  <g aria-label="three inputs map to one output">
    <circle cx="176" cy="116" r="44" fill="url(#glow)" filter="url(#softGlow)"/>
    <circle cx="176" cy="240" r="44" fill="url(#glow)" filter="url(#softGlow)"/>
    <circle cx="176" cy="364" r="44" fill="url(#glow)" filter="url(#softGlow)"/>

    <circle cx="176" cy="116" r="10" fill="#8EE3FF"/>
    <circle cx="176" cy="240" r="10" fill="#A7F3D0"/>
    <circle cx="176" cy="364" r="10" fill="#C4B5FD"/>
    <text x="210" y="124" fill="#C9D8EA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">p₁</text>
    <text x="210" y="248" fill="#C9D8EA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">p₂</text>
    <text x="210" y="372" fill="#C9D8EA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">p₃</text>

    <path d="M235 116C330 116 374 174 493 226" fill="none" stroke="url(#flow)" stroke-width="3"/>
    <path d="M235 240H493" fill="none" stroke="url(#flow)" stroke-width="3"/>
    <path d="M235 364C330 364 374 306 493 254" fill="none" stroke="url(#flow)" stroke-width="3"/>

    <rect x="316" y="215" width="76" height="50" rx="25" fill="#0E1B32" stroke="#7DD3FC" stroke-opacity="0.48"/>
    <text x="354" y="248" text-anchor="middle" fill="#E5F7FF" font-family="Georgia, Cambria, serif" font-size="28" font-style="italic">F</text>

    <circle cx="518" cy="240" r="55" fill="url(#glow)" filter="url(#softGlow)"/>
    <circle cx="518" cy="240" r="13" fill="#F8FAFC"/>
    <text x="518" y="305" text-anchor="middle" fill="#C9D8EA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">q</text>
  </g>

  <g aria-label="exact equations">
    <rect x="606" y="78" width="744" height="324" rx="24" fill="url(#equationPanel)" stroke="#8FB5D9" stroke-opacity="0.2"/>
    <path d="M650 135H1306" stroke="#8FB5D9" stroke-opacity="0.18"/>
    <circle cx="651" cy="108" r="5" fill="#8EE3FF"/>
    <circle cx="671" cy="108" r="5" fill="#A7F3D0"/>
    <circle cx="691" cy="108" r="5" fill="#C4B5FD"/>

    <text x="658" y="210" fill="#F4F8FC" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="60">
      det J<tspan baseline-shift="sub" font-size="35">F</tspan> ≡ −2
    </text>
    <text x="658" y="304" fill="#F4F8FC" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="48">
      F(p₁) = F(p₂) = F(p₃) = q
    </text>

    <rect x="658" y="340" width="188" height="34" rx="17" fill="#0B3B35" stroke="#6EE7B7" stroke-opacity="0.55"/>
    <circle cx="681" cy="357" r="5" fill="#6EE7B7"/>
    <text x="699" y="363" fill="#BDF9E3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.6">VERIFIED</text>
    <text x="1270" y="364" text-anchor="end" fill="#8FA8C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">exact rational evidence</text>
  </g>
</svg>
