[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jacobian-research-kernel"
version = "0.2.0a0"
description = "A capability-first MCP workbench for executable mathematics"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Jacobian contributors" }]
dependencies = [
    "jsonschema>=4.23,<5",
    "mcp==2.0.0b2",
    "mcp-types==2.0.0b2",
    "networkx>=3.4,<4",
    "pydantic>=2.12,<3",
    "rfc8785==0.1.4",
    "typer>=0.20,<1",
    "z3-solver>=4.15.4,<5",
]

[project.scripts]
jacobian = "jacobian.cli:app"
jacobian-mcp = "jacobian.adapters.mcp.server:main"

[dependency-groups]
dev = [
    "deptry>=0.21,<1",
    "hypothesis>=6.130,<7",
    "mypy>=1.15,<3",
    "pre-commit>=4.4,<5",
    "pyperf>=2.9,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.11,<1",
    "types-jsonschema>=4.23,<5",
    "types-networkx>=3.4,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jacobian", "src/jacobian_checkers"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -n auto --maxprocesses=4 --dist=worksteal"
testpaths = ["tests"]
timeout = 120
markers = [
    "contract: public wire and Python contract tests",
    "property: property-based invariant tests",
    "stateful: persistent lifecycle state-machine tests",
    "integration: real filesystem, SQLite, or process-boundary tests",
    "end_to_end: complete user-visible research-kernel workflows",
    "subprocess: clean-process replay tests",
    "conformance: normative release conformance cases",
    "differential: independent implementation comparisons",
    "external_backend: tests requiring an optional external engine",
    "slow: tests excluded from the fastest development loop",
    "benchmark: performance measurements",
    "agent_eval: model-in-the-loop evaluations",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "PTH",
    "RUF",
    "SIM",
    "TD",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 28

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jacobian", "jacobian_checkers"]

[tool.deptry]
extend_exclude = ["benchmarks"]
known_first_party = ["jacobian", "jacobian_checkers"]
per_rule_ignores = { "DEP002" = ["mcp-types"] }

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["jacobian", "jacobian_checkers"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
