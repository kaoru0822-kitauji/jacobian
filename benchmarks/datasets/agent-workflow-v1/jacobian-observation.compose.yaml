services:
  jacobian:
    image: ${JACOBIAN_IMAGE:-jacobian:local}
    command:
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --allow-anonymous
      - --reasoning-log-mode
      - ${JACOBIAN_REASONING_LOG_MODE:-off}
      - --state-dir
      - /state
    volumes:
      - jacobian-state:/state
volumes:
  jacobian-state: {}
