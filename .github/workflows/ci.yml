name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-lean: ${{ steps.classify.outputs.run-lean }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mapfile -d '' changed_paths < <(
              git diff --name-only -z "$BASE_SHA" "$HEAD_SHA"
            )
            plan_output=$(
              .github/scripts/classify-ci-paths "${changed_paths[@]}"
            )
          else
            plan_output=$'run-lean=true\nclassification=full'
          fi

          printf '%s\n' "$plan_output" >> "$GITHUB_OUTPUT"
          run_lean=$(sed -n 's/^run-lean=//p' <<< "$plan_output")
          classification=$(sed -n 's/^classification=//p' <<< "$plan_output")
          {
            echo "## CI plan"
            echo ""
            echo "- Classification: \`$classification\`"
            echo "- Run real Lean validation: \`$run_lean\`"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen --dev
      - run: make lint
      - run: make typecheck
      - name: Check TODO comments reference issues
        run: |
          violations="$(rg --pcre2 -n 'TODO(?!\(#\d+\))' --type py src/ tests/ || true)"
          if [ -n "$violations" ]; then
            echo "::error::TODOs must reference an issue: TODO(#123)"
            echo "$violations"
            exit 1
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen --dev
      - run: make security-audit

  validate-agents-md:
    name: Validate AGENTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen --dev
      - run: make build
      - run: uv run --frozen jacobian --help
      - run: uv run --frozen jacobian-mcp --help

  test:
    name: Tests (Python ${{ matrix.python-version }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen --dev
      - run: >-
          uv run --frozen python -c
          "import json, pathlib;
          data = json.loads(pathlib.Path('.test_durations').read_text());
          assert data, '.test_durations must contain measured test timings'"
      - if: matrix.python-version == '3.12'
        run: >-
          uv run --frozen pytest
          -m "not lean_runtime"
          --splits 2 --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --durations-path .test_durations
          --cov --cov-report= --cov-fail-under=0
          --durations=10
      - if: matrix.python-version != '3.12'
        run: >-
          uv run --frozen pytest
          -m "not lean_runtime"
          --splits 2 --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --durations-path .test_durations
          --durations=10
      - if: matrix.python-version == '3.12'
        run: mv .coverage .coverage.shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && matrix.python-version == '3.12' }}
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.shard-${{ matrix.shard }}
          include-hidden-files: true

  lean-test-shards:
    name: Lean Tests (${{ matrix.lane }})
    needs: plan
    if: needs.plan.outputs.run-lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare Lean test environment
        uses: ./.github/actions/setup-lean
      - name: Run Lean tests
        run: |
          started=$SECONDS
          set +e
          make test-lean
          status=$?
          set -e
          echo "| Selected Lean tests | $((SECONDS - started)) |" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          PYTEST_ARGS: >-
            --splits 2 --group ${{ matrix.lane }}
            --splitting-algorithm least_duration
            --durations-path .lean_test_durations
            --durations=10

  lean-test:
    name: Lean Tests
    if: always()
    needs: [plan, lean-test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require planned Lean validation
        env:
          RUN_LEAN: ${{ needs.plan.outputs.run-lean }}
          SHARD_RESULT: ${{ needs.lean-test-shards.result }}
        run: |
          if [ "$RUN_LEAN" = "true" ]; then
            test "$SHARD_RESULT" = "success"
          else
            test "$SHARD_RESULT" = "skipped"
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen --dev
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - run: uv run --frozen coverage combine coverage-data
      - run: uv run --frozen coverage report | tee coverage-report.txt
        shell: bash -o pipefail {0}
      - run: uv run --frozen coverage xml
      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request'
        run: |
          pct="$(grep -oP 'TOTAL\s+\d+\s+\d+\s+\K\d+(?=%)' coverage-report.txt || echo 'N/A')"
          {
            echo "## Coverage Report"
            echo ""
            echo '```'
            cat coverage-report.txt
            echo '```'
            echo ""
            echo "**Total coverage: ${pct}%** (threshold: 50%)"
            echo ""
            echo "Branch coverage enabled. Complexity tracked via Ruff C90 (max 28)."
            echo "Duplicate code detection via jscpd (threshold 10)."
          } > coverage-summary.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file coverage-summary.md || true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-3.12
          path: coverage.xml

  duplicate-code:
    name: Duplicate Code Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: npx --yes jscpd@5.0.12 --config .jscpd.json .

  npm-package:
    name: npm Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm test
        working-directory: npm
      - run: npm pack --dry-run
        working-directory: npm

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: |
          echo "::group::Build timing"
          /usr/bin/time -v make build 2>&1 | tee build-timing.log
          echo "::endgroup::"
      - name: Extract build metrics
        if: always()
        run: |
          {
            echo "## Build Performance"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            grep -oP '(Elapsed \(wall clock\) time.*|Maximum resident set size.*|User time.*|System time.*)' build-timing.log | while IFS=: read -r key val; do
              echo "| $(echo "$key" | xargs) | $(echo "$val" | xargs) |"
            done
            echo ""
            echo "Build cache: setup-uv (enabled), dependency cache keyed on pyproject.toml + uv.lock"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-timing
          path: build-timing.log
