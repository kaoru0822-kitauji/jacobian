name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen --dev
      - run: make lint
      - run: make typecheck

  test:
    name: Tests (Python ${{ matrix.python-version }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen --dev
      - if: matrix.python-version == '3.12'
        run: >-
          uv run --frozen pytest
          -m "not lean_runtime"
          --splits 2 --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --cov --cov-report= --cov-fail-under=0
          --durations=10
      - if: matrix.python-version != '3.12'
        run: >-
          uv run --frozen pytest
          -m "not lean_runtime"
          --splits 2 --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --durations=10
      - if: matrix.python-version == '3.12'
        run: mv .coverage .coverage.shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.python-version == '3.12' }}
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.shard-${{ matrix.shard }}
          include-hidden-files: true

  lean-test:
    name: Lean Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
          test: false
          lint: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen --dev
      - run: lake build repl
        working-directory: lean
      - run: make test-lean PYTEST_ARGS="--durations=10"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen --dev
      - uses: actions/download-artifact@v5
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - run: uv run --frozen coverage combine coverage-data
      - run: uv run --frozen coverage report
      - run: uv run --frozen coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-3.12
          path: coverage.xml

  duplicate-code:
    name: Duplicate Code Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes jscpd@5.0.12 --config .jscpd.json .

  npm-package:
    name: npm Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm test
        working-directory: npm
      - run: npm pack --dry-run
        working-directory: npm

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: |
          echo "::group::Build timing"
          /usr/bin/time -v make build 2>&1 | tee build-timing.log
          echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-timing
          path: build-timing.log

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    needs: [lint, test, lean-test, coverage, duplicate-code, npm-package, build]
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
      - name: Dispatch release publishing
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: >-
          gh workflow run release.yml
          --ref "$RELEASE_TAG"
          --field tag="$RELEASE_TAG"
