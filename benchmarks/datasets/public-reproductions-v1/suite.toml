schema_version = "1"

[dataset]
id = "jacobian/public-reproductions-v1"
version = "1.0.0"
title = "Jacobian public mathematical reproductions"
purpose = "Replay known public mathematical cases with deterministic, independently checked outcomes."
claim_class = "public-case-correctness"
answer_visibility = "public"
default_execution_profile = "oracle-only"
keywords = ["mathematics","jacobian","public-reproductions","verification","offline"]
authors = [{ name = "Jacobian contributors", email = "maintainers@jacobian.invalid" }]

