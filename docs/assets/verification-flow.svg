<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="350" viewBox="0 0 1440 350" role="img" aria-labelledby="title desc">
  <title id="title">A blackboard diagram of independent mathematical verification</title>
  <desc id="desc">A proposed collision becomes an exact witness, is replayed by an independent checker, and produces either a verified false conclusion or an unknown non-conclusion.</desc>
  <defs>
    <filter id="chalk" x="-3%" y="-8%" width="106%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.7" numOctaves="1" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.75"/>
    </filter>
    <pattern id="grain" width="170" height="110" patternUnits="userSpaceOnUse">
      <path d="M8 16c42 5 78-5 140 1M30 61c33-4 72 4 127-1M4 96c51 2 96-5 148 1" fill="none" stroke="#DDE5D8" stroke-opacity="0.018" stroke-width="3"/>
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 1L9 5.5L0 10" fill="none" stroke="#EDE8D5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="350" fill="#17251F"/>
  <rect width="1440" height="350" fill="url(#grain)"/>
  <path d="M30 27C394 22 1050 31 1410 26M31 323C474 328 1020 319 1408 324" fill="none" stroke="#D9D1B8" stroke-opacity="0.48" stroke-width="3" filter="url(#chalk)"/>

  <g filter="url(#chalk)">
    <text x="68" y="68" fill="#D8C779" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="25" font-style="italic">a claim earns trust in stages</text>

    <text x="82" y="128" fill="#B7D3C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">candidate</text>
    <text x="78" y="181" fill="#F1ECD8" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="37" font-style="italic">F(p) = F(q)</text>
    <text x="83" y="218" fill="#D7D0BA" font-family="Georgia, Cambria, serif" font-size="25" font-style="italic">p ≠ q  ?</text>
    <path d="M78 234C143 229 225 239 286 233" fill="none" stroke="#EDE8D5" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>

    <path d="M306 179C340 172 360 174 391 178" fill="none" stroke="#EDE8D5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <text x="411" y="128" fill="#B7D3C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">exact witness</text>
    <text x="407" y="181" fill="#F1ECD8" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="35" font-style="italic">(F, p, q)</text>
    <text x="412" y="218" fill="#D7D0BA" font-family="Georgia, Cambria, serif" font-size="23" font-style="italic">typed + inspectable</text>
    <path d="M407 234C492 230 578 238 641 232" fill="none" stroke="#EDE8D5" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>

    <path d="M650 179C681 174 702 175 733 179" fill="none" stroke="#EDE8D5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <path d="M754 96C836 89 972 94 1046 98M758 99C751 147 755 218 760 259M1045 98C1052 151 1047 215 1044 260M760 260C850 267 962 257 1044 261" fill="none" stroke="#D8C779" stroke-width="3" stroke-linecap="round"/>
    <text x="782" y="128" fill="#D8C779" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">independent checker</text>
    <text x="790" y="174" fill="#F1ECD8" font-family="Georgia, Cambria, serif" font-size="25" font-style="italic">p ≠ q</text>
    <text x="790" y="209" fill="#F1ECD8" font-family="Georgia, Cambria, serif" font-size="25" font-style="italic">F(p) − F(q) = 0</text>
    <text x="790" y="240" fill="#B7D3C3" font-family="Georgia, Cambria, serif" font-size="22" font-style="italic">replayed exactly</text>
    <path d="M952 229l7 8 15-19" fill="none" stroke="#B7D3C3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M1062 179C1092 174 1115 176 1143 179" fill="none" stroke="#EDE8D5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <text x="1166" y="128" fill="#B7D3C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">record</text>
    <text x="1161" y="185" fill="#E6B1A8" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="42">FALSE</text>
    <text x="1164" y="228" fill="#B7D3C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">VERIFIED</text>
    <path d="M1275 217l7 8 15-19" fill="none" stroke="#B7D3C3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1159 243C1235 238 1322 247 1363 241" fill="none" stroke="#B7D3C3" stroke-width="3" stroke-linecap="round"/>

    <path d="M901 271C902 289 934 297 982 298" fill="none" stroke="#D9D1B8" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="1003" y="306" fill="#D7D0BA" font-family="Georgia, Cambria, serif" font-size="19" font-style="italic">timeout / error / no witness → UNKNOWN</text>
  </g>
</svg>
