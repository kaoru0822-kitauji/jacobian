schema_version = "1"

[dataset]
id = "jacobian/research-diagnostics-v1"
version = "1.0.0"
title = "Jacobian research diagnostics"
purpose = "Answer-visible research challenges for case-level diagnostic runs, never held-out performance claims."
claim_class = "diagnostic"
answer_visibility = "public"
default_execution_profile = "oracle-only"
keywords = ["mathematics","jacobian","research-diagnostics","answer-visible","offline"]
authors = [{ name = "Jacobian contributors", email = "maintainers@jacobian.invalid" }]

