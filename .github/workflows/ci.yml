name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      run-python: ${{ steps.classify.outputs.run-python }}
      run-core: ${{ steps.classify.outputs.run-core }}
      run-integration: ${{ steps.classify.outputs.run-integration }}
      run-coverage: ${{ steps.classify.outputs.run-coverage }}
      run-compatibility: ${{ steps.classify.outputs.run-compatibility }}
      run-lean: ${{ steps.classify.outputs.run-lean }}
      run-npm: ${{ steps.classify.outputs.run-npm }}
      run-static: ${{ steps.classify.outputs.run-static }}
      run-build: ${{ steps.classify.outputs.run-build }}
      run-security: ${{ steps.classify.outputs.run-security }}
      run-duplicate: ${{ steps.classify.outputs.run-duplicate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare integration timing hint
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          .github/scripts/manage-test-timings prepare
          --output .ci/test-durations.json
      - name: Share integration timing hint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-durations-input
          path: .ci/test-durations.json
          include-hidden-files: true
          retention-days: 1
      - id: classify
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          FORCE_LEAN: ${{ contains(github.event.pull_request.labels.*.name, 'ci:lean') }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mapfile -d '' changed_paths < <(
              git diff --name-only -z "$BASE_SHA" "$HEAD_SHA"
            )
            planner_args=(--)
            if [ "$FORCE_FULL" = "true" ]; then
              planner_args=(--force-full --)
            elif [ "$FORCE_LEAN" = "true" ]; then
              planner_args=(--force-lean --)
            fi
            plan_output=$(
              .github/scripts/classify-ci-paths \
                "${planner_args[@]}" "${changed_paths[@]}"
            )
          else
            plan_output=$(.github/scripts/classify-ci-paths --force-exhaustive)
          fi

          printf '%s\n' "$plan_output" | .github/scripts/validate-ci-plan
          printf '%s\n' "$plan_output" >> "$GITHUB_OUTPUT"
          classification=$(sed -n 's/^classification=//p' <<< "$plan_output")
          {
            echo "## CI plan"
            echo ""
            echo "- Classification: \`$classification\`"
            echo ""
            echo '```text'
            echo "$plan_output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint & Format
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a valid static-analysis plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_STATIC: ${{ needs.plan.outputs.run-static }}
        run: |
          test "$PLAN_RESULT" = "success"
          case "$RUN_STATIC" in
            true|false) ;;
            *) exit 1 ;;
          esac
      - if: needs.plan.outputs.run-static == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.plan.outputs.run-static == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - if: needs.plan.outputs.run-static == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - if: needs.plan.outputs.run-static == 'true'
        run: uv sync --locked --dev
      - if: needs.plan.outputs.run-static == 'true'
        run: make lint-full
      - if: needs.plan.outputs.run-static == 'true'
        run: make typecheck
      - name: Check TODO comments reference issues
        if: needs.plan.outputs.run-static == 'true'
        run: |
          violations="$(rg --pcre2 -n 'TODO(?!\(#\d+\))' --type py src/ tests/ || true)"
          if [ -n "$violations" ]; then
            echo "::error::TODOs must reference an issue: TODO(#123)"
            echo "$violations"
            exit 1
          fi

  security-audit:
    name: Security Audit
    needs: plan
    if: needs.plan.outputs.run-security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --dev
      - run: make security-audit

  validate-agents-md:
    name: Validate Built Package
    needs: [plan, build]
    if: needs.plan.outputs.run-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Smoke-test the built wheel
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uvx --from "$wheel" jacobian --help
          uvx --from "$wheel" jacobian-mcp --help

  core-test:
    name: Tests (core, Python 3.12)
    needs: plan
    if: needs.plan.outputs.run-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.12"
      - run: make test-core
        env:
          PYTEST_ARGS: >-
            --junitxml=pytest.xml
            ${{ needs.plan.outputs.run-coverage == 'true' && '--cov --cov-report= --cov-fail-under=0' || '' }}
            --durations=10
      - if: ${{ !cancelled() }}
        run: uv cache prune --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: junit-core-3.12
          path: pytest.xml
          if-no-files-found: ignore
          retention-days: 7
      - if: needs.plan.outputs.run-coverage == 'true'
        run: mv .coverage .coverage.core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && needs.plan.outputs.run-coverage == 'true' }}
        with:
          name: coverage-data-core
          path: .coverage.core
          include-hidden-files: true

  integration-test:
    name: >-
      Tests (integration ${{ matrix.shard }} of 4,
      Python 3.12)
    needs: plan
    if: needs.plan.outputs.run-integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download integration timing hint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-test-durations-input
          path: .ci
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.12"
      - run: make test-integration
        env:
          PYTEST_ARGS: >-
            --splits 4
            --group ${{ matrix.shard }}
            --splitting-algorithm least_duration
            --durations-path .ci/test-durations.json
            --store-durations
            --clean-durations
            --junitxml=pytest.xml
            ${{ needs.plan.outputs.run-coverage == 'true' && '--cov --cov-report= --cov-fail-under=0' || '' }}
            --durations=10
      - name: Upload integration shard timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-duration-shard-${{ matrix.shard }}
          path: .ci/test-durations.json
          include-hidden-files: true
          retention-days: 1
      - if: ${{ !cancelled() }}
        run: uv cache prune --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: >-
            junit-integration-${{ matrix.shard }}-3.12
          path: pytest.xml
          if-no-files-found: ignore
          retention-days: 7
      - if: needs.plan.outputs.run-coverage == 'true'
        run: mv .coverage .coverage.integration-${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && needs.plan.outputs.run-coverage == 'true' }}
        with:
          name: coverage-data-integration-${{ matrix.shard }}
          path: .coverage.integration-${{ matrix.shard }}
          include-hidden-files: true

  publish-test-durations:
    name: Publish integration test durations
    if: github.ref == 'refs/heads/main'
    needs: integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download shard timings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-duration-shard-*
          path: .ci/shards
      - name: Merge shard timings
        run: >-
          .github/scripts/manage-test-timings merge
          --input .ci/shards/integration-duration-shard-1/test-durations.json
          --input .ci/shards/integration-duration-shard-2/test-durations.json
          --input .ci/shards/integration-duration-shard-3/test-durations.json
          --input .ci/shards/integration-duration-shard-4/test-durations.json
          --output .ci/integration-test-durations.json
          --source-sha "${{ github.sha }}"
          --python-version "3.12"
          --pytest-split-version "0.11.0"
      - name: Publish timing hint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-durations
          path: .ci/integration-test-durations.json
          include-hidden-files: true
          retention-days: 90

  compatibility-test:
    name: Exhaustive compatibility (Python 3.13)
    needs: plan
    if: needs.plan.outputs.run-compatibility == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.13"
      - run: make test
        env:
          PYTEST_ARGS: --junitxml=pytest.xml --durations=10
      - if: ${{ !cancelled() }}
        run: uv cache prune --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: junit-compatibility-3.13
          path: pytest.xml
          if-no-files-found: ignore
          retention-days: 7

  python-test:
    name: Python Tests
    if: ${{ !cancelled() }}
    needs: [plan, core-test, integration-test, compatibility-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require planned Python validation
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_PYTHON: ${{ needs.plan.outputs.run-python }}
          RUN_CORE: ${{ needs.plan.outputs.run-core }}
          RUN_INTEGRATION: ${{ needs.plan.outputs.run-integration }}
          RUN_COMPATIBILITY: ${{ needs.plan.outputs.run-compatibility }}
          CORE_RESULT: ${{ needs.core-test.result }}
          INTEGRATION_RESULT: ${{ needs.integration-test.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility-test.result }}
        run: |
          test "$PLAN_RESULT" = "success"
          case "$RUN_PYTHON" in
            true|false) ;;
            *) exit 1 ;;
          esac
          case "$RUN_CORE" in
            true) test "$CORE_RESULT" = "success" ;;
            false) test "$CORE_RESULT" = "skipped" ;;
            *) exit 1 ;;
          esac
          case "$RUN_INTEGRATION" in
            true) test "$INTEGRATION_RESULT" = "success" ;;
            false) test "$INTEGRATION_RESULT" = "skipped" ;;
            *) exit 1 ;;
          esac
          case "$RUN_COMPATIBILITY" in
            true) test "$COMPATIBILITY_RESULT" = "success" ;;
            false) test "$COMPATIBILITY_RESULT" = "skipped" ;;
            *) exit 1 ;;
          esac

  lean-test-run:
    name: Lean Runtime
    needs: plan
    if: needs.plan.outputs.run-lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Lean test environment
        uses: ./.github/actions/setup-lean
      - name: Run Lean tests
        run: |
          started=$SECONDS
          set +e
          make test-lean
          status=$?
          set -e
          echo "| Selected Lean tests | $((SECONDS - started)) |" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          PYTEST_ARGS: --durations=10

  lean-test:
    name: Lean Tests
    if: ${{ !cancelled() }}
    needs: [plan, lean-test-run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require planned Lean validation
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_LEAN: ${{ needs.plan.outputs.run-lean }}
          LEAN_RESULT: ${{ needs.lean-test-run.result }}
        run: |
          test "$PLAN_RESULT" = "success"
          case "$RUN_LEAN" in
            true) test "$LEAN_RESULT" = "success" ;;
            false) test "$LEAN_RESULT" = "skipped" ;;
            *) exit 1 ;;
          esac

  coverage:
    name: Coverage
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan, core-test, integration-test]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require successful Python validation
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_COVERAGE: ${{ needs.plan.outputs.run-coverage }}
          CORE_RESULT: ${{ needs.core-test.result }}
          INTEGRATION_RESULT: ${{ needs.integration-test.result }}
        run: |
          test "$PLAN_RESULT" = "success"
          case "$RUN_COVERAGE" in
            true|false) ;;
            *) exit 1 ;;
          esac
          if [ "$RUN_COVERAGE" = "true" ]; then
            test "$CORE_RESULT" = "success"
            test "$INTEGRATION_RESULT" = "success"
          fi
      - if: needs.plan.outputs.run-coverage == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.plan.outputs.run-coverage == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - if: needs.plan.outputs.run-coverage == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - if: needs.plan.outputs.run-coverage == 'true'
        run: uv sync --locked --dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.run-coverage == 'true'
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - if: needs.plan.outputs.run-coverage == 'true'
        run: uv run --locked coverage combine coverage-data
      - if: needs.plan.outputs.run-coverage == 'true'
        run: uv run --locked coverage report --fail-under=50 | tee coverage-report.txt
        shell: bash -o pipefail {0}
      - if: needs.plan.outputs.run-coverage == 'true'
        run: uv run --locked coverage xml
      - name: Post coverage summary to PR
        if: >-
          needs.plan.outputs.run-coverage == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.type != 'Bot' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          pct="$(awk '$1 == "TOTAL" { value = $NF; sub(/%$/, "", value); print value }' coverage-report.txt)"
          test -n "$pct"
          {
            echo "<!-- jacobian-coverage-report -->"
            echo "## Coverage Report"
            echo ""
            echo '```'
            cat coverage-report.txt
            echo '```'
            echo ""
            echo "**Total coverage: ${pct}%** (threshold: 50%)"
            echo ""
            echo "Branch coverage enabled. Complexity tracked via Ruff C90 (max 28)."
            echo "Duplicate code detection via jscpd (threshold 10)."
          } > coverage-summary.md
          jq -n --rawfile body coverage-summary.md '{body: $body}' > coverage-comment.json
          mapfile -t comment_ids < <(
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select((.body | contains("<!-- jacobian-coverage-report -->")) or (.body | startswith("## Coverage Report"))) | .id'
          )
          if [ "${#comment_ids[@]}" -eq 0 ]; then
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --input coverage-comment.json
          else
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/${comment_ids[0]}" \
              --input coverage-comment.json
            for duplicate_id in "${comment_ids[@]:1}"; do
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/issues/comments/$duplicate_id"
            done
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.plan.outputs.run-coverage == 'true'
        with:
          name: coverage-3.12
          path: coverage.xml

  duplicate-code:
    name: Duplicate Code Detection
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a valid duplicate-code plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_DUPLICATE: ${{ needs.plan.outputs.run-duplicate }}
        run: |
          test "$PLAN_RESULT" = "success"
          case "$RUN_DUPLICATE" in
            true|false) ;;
            *) exit 1 ;;
          esac
      - if: needs.plan.outputs.run-duplicate == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.plan.outputs.run-duplicate == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - if: needs.plan.outputs.run-duplicate == 'true'
        run: npx --yes jscpd@5.0.12 --config .jscpd.json .

  npm-package:
    name: npm Package
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a valid npm plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_NPM: ${{ needs.plan.outputs.run-npm }}
        run: |
          test "$PLAN_RESULT" = "success"
          case "$RUN_NPM" in
            true|false) ;;
            *) exit 1 ;;
          esac
      - if: needs.plan.outputs.run-npm == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.plan.outputs.run-npm == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - if: needs.plan.outputs.run-npm == 'true'
        run: npm test
        working-directory: npm
      - if: needs.plan.outputs.run-npm == 'true'
        run: npm pack --dry-run
        working-directory: npm

  build:
    name: Build
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a valid build plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_BUILD: ${{ needs.plan.outputs.run-build }}
        run: |
          test "$PLAN_RESULT" = "success"
          case "$RUN_BUILD" in
            true|false) ;;
            *) exit 1 ;;
          esac
      - if: needs.plan.outputs.run-build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.plan.outputs.run-build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - if: needs.plan.outputs.run-build == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - if: needs.plan.outputs.run-build == 'true'
        run: |
          echo "::group::Build timing"
          /usr/bin/time -v make build 2>&1 | tee build-timing.log
          echo "::endgroup::"
      - name: Extract build metrics
        if: >-
          ${{
            !cancelled() &&
            needs.plan.result == 'success' &&
            needs.plan.outputs.run-build == 'true'
          }}
        run: |
          {
            echo "## Build Performance"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            grep -oP '(Elapsed \(wall clock\) time.*|Maximum resident set size.*|User time.*|System time.*)' build-timing.log | while IFS=: read -r key val; do
              echo "| $(echo "$key" | xargs) | $(echo "$val" | xargs) |"
            done
            echo ""
            echo "Build cache: setup-uv (enabled), dependency cache keyed on pyproject.toml + uv.lock"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.plan.outputs.run-build == 'true'
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: >-
          ${{
            !cancelled() &&
            needs.plan.result == 'success' &&
            needs.plan.outputs.run-build == 'true'
          }}
        with:
          name: build-timing
          path: build-timing.log

  ci-metrics:
    name: CI Metrics
    if: ${{ !cancelled() }}
    needs:
      - plan
      - lint
      - security-audit
      - validate-agents-md
      - core-test
      - integration-test
      - compatibility-test
      - python-test
      - lean-test-run
      - lean-test
      - coverage
      - duplicate-code
      - npm-package
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch completed job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100"
          --paginate --slurp > ci-jobs.json
      - name: Report critical path and runner time
        run: |
          .github/scripts/summarize-ci-timings ci-jobs.json | tee ci-timings.md
          cat ci-timings.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-timings
          path: ci-timings.md
          retention-days: 30
